name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile with warnings as errors
        shell: cmd
        run: build.cmd
      - name: Smoke test
        shell: pwsh
        run: ./tests/smoke-test.ps1
